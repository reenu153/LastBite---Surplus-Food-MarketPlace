# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also wipe the data)
# psql:   docker exec -it tgtg-postgres psql -U tgtg -d tgtg
services:
  postgres:
    image: postgres:16-alpine
    container_name: tgtg-postgres
    environment:
      POSTGRES_DB: tgtg
      POSTGRES_USER: tgtg
      POSTGRES_PASSWORD: tgtg   # ADAPT: local dev only, never commit real passwords
    ports:
      - "5432:5432"             # ADAPT: use "5433:5432" if you already run Postgres locally
    volumes:
      - pgdata:/var/lib/postgresql/data   # LEARN: named volume keeps data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgtg -d tgtg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
