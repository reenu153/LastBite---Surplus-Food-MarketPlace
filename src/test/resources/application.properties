# LEARN: Files in src/test/resources override src/main/resources during tests,
# so `mvn test` runs against in-memory H2 and doesn't need Docker running.
# ADAPT: for tests against real Postgres, use Testcontainers instead.
spring.datasource.url=jdbc:h2:mem:tgtg;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
