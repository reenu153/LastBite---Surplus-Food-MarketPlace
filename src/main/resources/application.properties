spring.application.name=tgtg-backend

# LEARN: Points at the Postgres container from docker-compose.yml.
# ${ENV_VAR:default} lets you override via environment variables (e.g. in prod).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tgtg}
spring.datasource.username=${DB_USER:tgtg}
spring.datasource.password=${DB_PASSWORD:tgtg}

# LEARN: "update" lets Hibernate create/alter tables and KEEPS data between restarts.
# ADAPT: real projects use Flyway migrations and set this to "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
